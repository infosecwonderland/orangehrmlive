name: CI

on:
  push:
    branches: 
      - main
      - "**/feature/**"

jobs:
  test:
    name: Cypress Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@latest

      - name: Run UI tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: ${{ matrix.browser }}
          config: specPattern=cypress/e2e/**/*.cy.ts,excludeSpecPattern=cypress/e2e/**/*.api.cy.ts
        env:
          CYPRESS_allure: true

      - name: Run API tests
        if: matrix.browser == 'chrome'
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          config: specPattern=cypress/e2e/**/*.api.cy.ts
        env:
          CYPRESS_allure: true

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore

  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Chrome results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-chrome
          path: allure-results/
        continue-on-error: true

      - name: Download Firefox results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-firefox
          path: allure-results/
        continue-on-error: true

      - name: Generate Allure report
        run: npm run allure:report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
