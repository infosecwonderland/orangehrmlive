name: CI

on:
  push:
    branches:
      - main
      - "**/feature/**"

jobs:
  test-ui:
    name: UI Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@latest

      - name: Run UI tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: ${{ matrix.browser }}
          config: 'specPattern=cypress/e2e/**/*.cy.ts,excludeSpecPattern=["cypress/e2e/**/*.api.cy.ts","cypress/e2e/performance/**","cypress/e2e/security/**"]'
        env:
          # Allure is also enabled by default in cypress.config.ts (env.allure)
          CYPRESS_allure: "true"

      - name: Upload UI allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore

  test-api:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          config: specPattern=cypress/e2e/**/*.api.cy.ts
        env:
          CYPRESS_allure: "true"

      - name: Upload API allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/
          if-no-files-found: ignore

  test-performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          config: specPattern=cypress/e2e/performance/performance.cy.ts
        env:
          CYPRESS_allure: "true"

      - name: Upload performance allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-performance
          path: allure-results/
          if-no-files-found: ignore

  test-security:
    name: Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          config: specPattern=cypress/e2e/security/**/*.cy.ts
        env:
          CYPRESS_allure: "true"

      - name: Upload security allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-security
          path: allure-results/
          if-no-files-found: ignore

  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    needs: [test-ui, test-api, test-performance, test-security]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download UI results (chrome)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ui-chrome
          path: allure-results/
        continue-on-error: true

      - name: Download UI results (firefox)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ui-firefox
          path: allure-results/
        continue-on-error: true

      - name: Download API results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/
        continue-on-error: true

      - name: Download performance results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-performance
          path: allure-results/
        continue-on-error: true

      - name: Download security results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-security
          path: allure-results/
        continue-on-error: true

      - name: Generate Allure report
        shell: bash
        run: |
          mkdir -p allure-results
          if find allure-results -type f -name '*.json' 2>/dev/null | grep -q .; then
            npm run allure:report
          else
            echo "::warning::No Allure JSON files in allure-results — creating placeholder report"
            mkdir -p allure-report
            printf '%s\n' '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Allure</title></head><body><p>No Allure result files were collected. Check Cypress jobs and <code>allure-results</code> uploads.</p></body></html>' > allure-report/index.html
          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
